# ============================
#    OptSAR-Net + Extra P2
# ============================

nc: 50 # number of classes

scales:
  s: [0.33, 0.50, 1024]

# ============================
#        BACKBONE
# ============================
backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]] # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1 - P2/4
  - [-1, 3, C2f, [128, True]] # 2

  - [-1, 1, Conv, [256, 3, 2]] # 3 - P3/8
  - [-1, 6, C2f, [256, True]] # 4

  - [-1, 1, Conv, [512, 3, 2]] # 5 - P4/16
  - [-1, 6, C2f, [512, True]] # 6

  - [-1, 1, Conv, [1024, 3, 2]] # 7 - P5/32
  - [-1, 3, DAAM, [1024]] # 8
  - [-1, 1, BSPPF, [1024, 5]] # 9 (final backbone output)

# ============================
#            HEAD
# ============================

head:
  # ---------------- P5 → P4 ----------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 (concat with P4)
  - [-1, 3, VSSA, [512]] # 12 (P4 head)

  # ---------------- P4 → P3 ----------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 (concat with P3)
  - [-1, 3, VSSA, [256]] # 15 (P3 head)

  # ---------------- P3 → P2 (NEW) ----------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 2], 1, Concat, [1]] # 17 (concat with P2)
  - [-1, 3, VSSA, [128]] # 18 (P2 head)  ★ NEW small-object head

  # ---------------- P2 → P3 ----------------
  - [-1, 1, Conv, [256, 3, 2]] # 19 (down to P3)
  - [[-1, 15], 1, Concat, [1]] # 20
  - [-1, 3, VSSA, [256]] # 21 (P3 refined)

  # ---------------- P3 → P4 ----------------
  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23
  - [-1, 3, VSSA, [512]] # 24 (P4 refined)

  # ---------------- P4 → P5 ----------------
  - [-1, 1, Conv, [1024, 3, 2]] # 25
  - [[-1, 9], 1, Concat, [1]] # 26
  - [-1, 3, VSSA, [1024]] # 27 (P5 refined)

  # ---------------- DETECTION (4 Heads) ----------------
  - [[18, 21, 24, 27], 1, Detect, [nc]] # 28 (P2, P3, P4, P5)
